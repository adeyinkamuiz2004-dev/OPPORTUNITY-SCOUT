# ---------------------------------------------------------------
# Opportunity Scout - configuration
# Edit this file to add sources, change keywords, or tune scoring.
# ---------------------------------------------------------------

settings:
  min_score: 25            # items below this score are dropped
  closing_soon_days: 14    # "closing soon" window
  max_deep_fetch: 60       # max pages opened per run to read deadlines
  request_delay: 1.0       # seconds between page requests (be polite)
  drop_expired: true
  max_age_days: 45         # ignore feed posts older than this

# --- 1. RSS / Atom feeds from opportunity sites ---------------------------
# If a feed breaks, the run log says so. Fix the URL or set enabled: false.
feeds:
  - {name: Opportunity Desk,        url: "https://opportunitydesk.org/feed/",                weight: 1.0}
  - {name: Opportunities for Africans, url: "https://www.opportunitiesforafricans.com/feed/", weight: 1.0}
  - {name: Scholars4Dev,            url: "https://www.scholars4dev.com/feed/",               weight: 1.0}
  - {name: After School Africa,     url: "https://www.afterschoolafrica.com/feed/",          weight: 1.0}
  - {name: YouthOp,                 url: "https://youthop.com/feed",                         weight: 0.9}
  - {name: Scholarship Positions,   url: "https://scholarship-positions.com/feed/",          weight: 0.9}
  - {name: Class Central,           url: "https://www.classcentral.com/report/feed/",        weight: 0.8}

# --- 2. Search-driven discovery via Google News RSS -----------------------
# Each query is run every day. Add your own lines freely.
google_news:
  enabled: true
  when: 14d
  region: {hl: "en-NG", gl: "NG", ceid: "NG:en"}
  queries:
    - political science internship Africa
    - political science graduate fellowship applications open
    - fully funded masters public policy Nigerian students
    - fully funded scholarship international relations
    - governance fellowship Africa call for applications
    - democracy elections fellowship young Africans
    - free online course political science certificate
    - free public policy course certificate
    - research writing course free certificate
    - academic writing course free certificate
    - research methods free online course certificate
    - data analysis social science free course
    - MOOC international relations free
    - peace and conflict studies free course
    - UN internship applications open
    - think tank internship remote
    - research assistant opening political science remote
    - graduate trainee programme Nigeria applications
    - essay competition youth Nigeria
    - call for papers political science
    - Chevening Commonwealth scholarship applications
    - Mastercard Foundation scholars programme applications
    - DAAD public policy governance scholarship
    - young African leaders fellowship applications

# --- 3. Any web page that lists opportunities (optional) -------------------
# link_selector: CSS selector that matches the <a> tags to collect.
html_pages:
  - name: Example (turn on and edit)
    enabled: false
    url: "https://example.org/opportunities"
    link_selector: "article h2 a"
    weight: 1.0

# --- 4. Scoring vocabulary -------------------------------------------------
# An item must contain at least one opportunity term.
opportunity_terms:
  - internship
  - intern
  - fellowship
  - scholarship
  - bursary
  - grant
  - traineeship
  - trainee
  - call for applications
  - call for application
  - applications open
  - application open
  - apply now
  - apply for
  - vacancy
  - vacancies
  - recruitment
  - job opening
  - opening
  - course
  - mooc
  - certificate
  - certification
  - programme
  - program
  - training
  - bootcamp
  - essay competition
  - call for papers
  - writing competition
  - award

# Order matters: the first category that matches wins.
categories:
  - name: Scholarship / Funded study
    terms: [scholarship, fully funded, bursary, "master's", masters, msc, ma degree, phd, chevening, commonwealth, daad]
  - name: Fellowship
    terms: [fellowship, fellows]
  - name: Internship / Trainee
    terms: [internship, intern, traineeship, trainee, graduate programme, graduate program]
  - name: Course / MOOC / Certificate
    terms: [mooc, online course, free course, certificate, certification, bootcamp, short course, training, coursera, edx, futurelearn, class central]
  - name: Competition / Call for papers
    terms: [essay competition, writing competition, call for papers, call for abstracts, award, prize, contest]
  - name: Job / Opening
    terms: [vacancy, vacancies, job, recruitment, hiring, opening, research assistant, analyst]

